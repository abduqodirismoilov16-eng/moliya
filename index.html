<style>
:root{
  color-scheme:light;
  --bg:radial-gradient(60% 30% at 90% 0%,rgba(95,139,255,.22) 0%,rgba(95,139,255,0) 70%),radial-gradient(70% 35% at 0% 60%,rgba(95,139,255,.16) 0%,rgba(95,139,255,0) 70%),linear-gradient(180deg,#F6F8FF 0%,#EAF0FD 50%,#DDE6FA 100%);
  --ink:#0B1530;--ink2:#3A4670;--ink3:#56628C;
  --glass:linear-gradient(150deg,rgba(255,255,255,.92),rgba(255,255,255,.7));
  --glass-b:rgba(255,255,255,.95);
  --glass-sh:inset 0 1px 0 #fff,0 8px 24px rgba(15,28,80,.09);
  --solid:#F3F6FD;
  --pri:#2148C9;--pri-ink:#1B3FB8;
  --pri-grad:linear-gradient(180deg,#5F8BFF 0%,#2148C9 55%,#11288A 100%);
  --pri-glow:inset 0 2px 3px rgba(255,255,255,.55),0 8px 22px rgba(33,72,201,.42);
  --lorb:radial-gradient(circle at 35% 28%,#FFFFFF 0%,#EEF2FD 45%,#C6D3F3 100%);
  --lorb-sh:inset 0 -4px 8px rgba(55,78,140,.22),inset 0 2px 3px #fff,0 4px 10px rgba(15,28,80,.16);
  --dorb:radial-gradient(circle at 35% 28%,#4A5A92 0%,#141D45 48%,#070B1E 100%);
  --dorb-sh:inset 0 -4px 8px rgba(0,0,0,.45),inset 0 2px 3px rgba(255,255,255,.3),0 6px 14px rgba(15,28,80,.3);
  --red:#C42B3C;--green:#0E7A55;--amber:#A15C07;
  --track:rgba(11,21,48,.12);--line:rgba(11,21,48,.08);
  --c1:#0A1A66;--c2:#2148C9;--c3:#4F7BEA;--c4:#8FAEF5;--c5:#C9D7FA;--c6:#FFFFFF;
  --nav:rgba(255,255,255,.86);
  --tab-on:rgba(33,72,201,.12);
  --addbg:#EAF0FD;
  --overlay:rgba(11,21,48,.35);
  --hdr:#0B1530;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:radial-gradient(60% 35% at 85% 0%,rgba(95,139,255,.35) 0%,rgba(95,139,255,0) 70%),radial-gradient(70% 40% at 0% 60%,rgba(33,72,201,.35) 0%,rgba(33,72,201,0) 70%),linear-gradient(175deg,#1A2350 0%,#0E1533 55%,#070B1E 100%);
  --ink:#EEF2FD;--ink2:#AAB6DB;--ink3:#8D9AC4;
  --glass:linear-gradient(150deg,rgba(255,255,255,.15),rgba(255,255,255,.05));
  --glass-b:rgba(255,255,255,.16);
  --glass-sh:inset 0 1px 0 rgba(255,255,255,.14),0 10px 28px rgba(0,0,0,.35);
  --solid:#141C3E;
  --pri-ink:#8FAEF5;
  --lorb:radial-gradient(circle at 35% 28%,#43528C 0%,#1D2856 50%,#0E1533 100%);
  --lorb-sh:inset 0 -4px 8px rgba(0,0,0,.35),inset 0 2px 3px rgba(255,255,255,.18),0 4px 10px rgba(0,0,0,.3);
  --red:#FF7A88;--green:#3DD598;--amber:#F5B544;
  --track:rgba(255,255,255,.12);--line:rgba(255,255,255,.08);
  --c1:#C9D7FA;--c2:#8FAEF5;--c3:#5F8BFF;--c4:#2148C9;--c5:#1A2A70;--c6:#0A1A66;
  --nav:rgba(20,28,62,.82);
  --tab-on:rgba(143,174,245,.18);
  --addbg:#0E1533;
  --overlay:rgba(0,0,0,.55);
  --hdr:#EEF2FD;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
html{background:#DDE6FA}:root[data-theme=dark],:root[data-theme=dark] body{background-color:#070B1E}
body::before{content:"";position:fixed;inset:0;background:var(--bg);z-index:-1;pointer-events:none}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:transparent;font-size:15px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:110px}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:calc(16px + env(safe-area-inset-top)) 20px 12px;gap:10px;color:var(--hdr)}
.hdr h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.5px}
.hdr .sub{font-size:13px;color:var(--ink2);font-weight:500}
.wrap{padding:0 20px}
.glass{background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--glass-sh);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:24px}
.card{padding:16px;margin-bottom:12px}
.orb{background:var(--lorb);box-shadow:var(--lorb-sh);color:var(--ink);border:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.orb.dark{background:var(--dorb);box-shadow:var(--dorb-sh);color:#fff}
.orb.pri,.btn-pri{background:var(--pri-grad);box-shadow:var(--pri-glow);color:#fff}
.o40{width:40px;height:40px}.o44{width:44px;height:44px}.o48{width:48px;height:48px}.o54{width:54px;height:54px}
.btn{border:0;border-radius:16px;height:50px;padding:0 18px;font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn-pri{border:0}
.btn-sec{background:var(--glass);border:1px solid var(--glass-b);color:var(--ink);box-shadow:var(--glass-sh)}
.btn-del{background:transparent;color:var(--red);box-shadow:none}
.btn:disabled{opacity:.6}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--ink2);font-size:13px}
.small{font-size:12px}
.b{font-weight:700}.xb{font-weight:800}
/* Summalarda xonalar orasi aniq ko'rinsin */
.b,.xb,.amt,.big,.val,.inc,.exp{word-spacing:.03em;font-variant-numeric:tabular-nums}
.inc{color:var(--green)}.exp{color:var(--red)}.warn{color:var(--amber)}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 8px;font-size:16px;font-weight:800;color:var(--hdr)}
.sec-title a,.link{font-size:13px;font-weight:700;color:var(--pri-ink);background:none;border:0;padding:0}
.label-up{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--ink2);margin:18px 4px 8px}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.li:last-child{border-bottom:0}
.li .mid{flex:1;min-width:0}
.li .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.li .amt{font-size:15px;font-weight:700;white-space:nowrap}
.list{padding:4px 14px}
.bar{height:7px;border-radius:4px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--pri-grad)}
.seg{display:flex;padding:4px;gap:4px;border-radius:18px}
.seg button{flex:1;height:38px;border:0;border-radius:14px;background:transparent;font-size:13px;font-weight:700;color:var(--ink2)}
.seg button.on{background:var(--pri-grad);color:#fff;box-shadow:var(--pri-glow)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;font-size:13px;font-weight:700;border:0}
.hero{border-radius:28px;padding:20px;color:#fff;background:var(--pri-grad);box-shadow:inset 0 2px 4px rgba(255,255,255,.5),0 14px 32px rgba(33,72,201,.4)}
.hero .lbl{font-size:13px;font-weight:600;color:#DCE6FF}
.hero .big{font-size:36px;font-weight:800;letter-spacing:-.4px;line-height:1.1;margin:4px 0 2px}
.hero .pill{flex:1;background:rgba(255,255,255,.16);border-radius:16px;padding:10px 12px}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:18px 0 4px}
.quick button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--hdr);padding:0}
.monthnav{display:flex;align-items:center;gap:2px;padding:4px;border-radius:22px}
.monthnav button{width:34px;height:34px;border:0;border-radius:17px;background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center}
.monthnav b{font-size:14px;padding:0 4px;min-width:72px;text-align:center}
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:calc(100% - 32px);max-width:488px;height:70px;border-radius:35px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;z-index:20;background:var(--nav);border:1px solid var(--glass-b);box-shadow:var(--glass-sh);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
nav.tabs button{justify-self:center;width:66px;height:54px;border:0;border-radius:20px;background:transparent;color:var(--ink3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:700;transition:background .2s,color .2s,transform .12s}
nav.tabs button.on{color:var(--pri-ink);background:var(--tab-on)}
nav.tabs button.on svg{stroke-width:2.5}
nav.tabs button:active{transform:scale(.9)}
nav.tabs button.fab{width:58px;height:58px;border-radius:29px;background:var(--pri-grad);box-shadow:var(--pri-glow);color:#fff}
.li,.card,.orb,.chip,.btn,.quick button,.cats button,.chips button,.seg button{transition:transform .12s,opacity .12s}
.li:active,button.card:active{opacity:.7}
.orb:active,.chip:active,.btn:active,.quick button:active,.cats button:active,.chips button:active{transform:scale(.94)}
.emo{line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.debt .k{font-size:12px;color:var(--ink2);font-weight:600}
.debt .v{font-size:14px;font-weight:700;margin-top:2px}
.tabline{display:flex;border-bottom:1px solid var(--line);margin:0 20px}
.tabline button{flex:1;height:44px;border:0;background:none;font-size:15px;font-weight:700;color:var(--ink3);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabline button.on{color:var(--pri-ink);border-bottom-color:var(--pri)}
.emojis{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.emojis button{height:40px;border:0;border-radius:12px;background:transparent;font-size:22px}
.emojis button.on{background:var(--tab-on);outline:2px solid var(--pri)}
.day{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--hdr);margin:16px 6px 6px;opacity:.85}
.empty{text-align:center;padding:28px 10px;color:var(--ink2);font-size:14px}
.donut{width:150px;height:150px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(15,28,80,.25)}
.donut>div{width:108px;height:108px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--lorb);box-shadow:var(--lorb-sh)}
.dot{width:10px;height:10px;border-radius:5px;flex:0 0 auto}
.bars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;height:110px}
.bars .col{display:flex;flex-direction:column;align-items:center;gap:6px}
.bars .pair{display:flex;gap:4px;align-items:flex-end;height:86px}
.bars .pair i{display:block;width:11px;border-radius:6px;min-height:3px}
.toggle{width:46px;height:28px;border-radius:14px;background:var(--track);position:relative;border:0;flex:0 0 auto;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.toggle.on{background:var(--pri)}
.toggle.on::after{left:21px}
/* sheets */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:40;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex;animation:fade .18s}
.panel{width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));background:var(--solid);box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:up .22s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--track);margin:0 auto 12px}
.panel h3{margin:4px 0 14px;font-size:19px;font-weight:800}
label.f{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:12px 2px 6px}
.inp{width:100%;height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--glass);font-size:16px;color:var(--ink);outline:none}
.inp:focus{border-color:var(--pri)}
select.inp{appearance:none}
.icons{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;justify-items:center}
.icons button.on{outline:2px solid var(--pri);outline-offset:2px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* add screen */
#add{position:fixed;inset:0;z-index:30;background:var(--bg);background-color:var(--addbg);display:none;flex-direction:column;max-width:520px;margin:0 auto;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
#add.open{display:flex;animation:fade .15s}
.amount{display:flex;flex-direction:column;align-items:center;padding:14px 20px 6px}
.amount .expr{font-size:14px;font-weight:600;color:var(--ink2);min-height:18px}
.amount .val{font-size:46px;font-weight:800;letter-spacing:-.6px;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amount .cur{font-size:20px;color:var(--ink2);font-weight:700}
.cats{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:72px;gap:10px 4px;overflow-x:auto;padding:10px 16px 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--hdr);padding:0}
.cats button span.n{max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cats button.on .orb{background:var(--pri-grad);box-shadow:var(--pri-glow);color:#fff}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:8px 18px 0}
.keys button{height:58px;border-radius:20px;border:1px solid var(--glass-b);background:var(--glass);box-shadow:var(--glass-sh);font-size:24px;font-weight:600;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.keys button.op{background:var(--dorb);box-shadow:var(--dorb-sh);color:#fff;border:0}
.keys button.ok{background:var(--pri-grad);box-shadow:var(--pri-glow);color:#fff;border:0}
.keys button:active{transform:scale(.95)}
.wrapli .t,.wrapli .s{white-space:normal;overflow:visible;text-overflow:clip}
#lock{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:calc(64px + env(safe-area-inset-top)) 28px calc(34px + env(safe-area-inset-bottom));background:var(--hero);color:#fff;animation:fade .2s}
#lock.out{opacity:0;transition:opacity .2s}
.lk-top{display:flex;flex-direction:column;align-items:center;gap:8px}
.lk-t{font-size:22px;font-weight:800;margin-top:8px}.lk-s{font-size:14px;opacity:.8;min-height:20px;text-align:center}.lk-s.bad{color:#FFB4BD;opacity:1}
.lk-dots{display:flex;gap:16px;margin-top:22px}.lk-dots i{width:14px;height:14px;border-radius:7px;border:2px solid rgba(255,255,255,.7);transition:background .15s}.lk-dots i.on{background:#fff;border-color:#fff}
.lk-keys{display:grid;grid-template-columns:repeat(3,76px);gap:18px 30px}
.lk-keys button{width:76px;height:76px;border-radius:38px;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:30px;font-weight:600;display:flex;align-items:center;justify-content:center}
.lk-keys button:active{background:rgba(255,255,255,.28);transform:scale(.94)}
.lk-keys button[data-k=bio],.lk-keys button[data-k=del]{background:transparent}
.pend{display:inline-flex;vertical-align:-1px;margin-right:5px;color:var(--pri,#2148C9);opacity:.75;animation:pendSpin 1.4s linear infinite}@keyframes pendSpin{to{transform:rotate(360deg)}}.eyeb{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:10px;border:0;padding:0;background:rgba(33,72,201,.08);color:var(--ink2,#3A4670);cursor:pointer;flex:none}.eyeb.dk{background:rgba(255,255,255,.16);color:#fff}.qpill.bad{background:#C42B3C}.qpill{cursor:pointer;position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);z-index:55;display:none;align-items:center;gap:6px;padding:6px 12px;border-radius:14px;background:#B26A00;color:#fff;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#0B1530;color:#fff;padding:12px 18px;border-radius:16px;font-size:14px;font-weight:600;z-index:60;display:none;max-width:calc(100% - 40px);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.loading{display:flex;align-items:center;justify-content:center;min-height:70vh;flex-direction:column;gap:14px;color:var(--hdr);font-weight:600}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid var(--track);border-top-color:var(--pri);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pin{max-width:340px;margin:12vh auto 0;padding:28px 24px;text-align:center}
.pin input{text-align:center;font-size:26px;letter-spacing:10px;margin:18px 0}
.dim{opacity:.55}
.search{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;border-radius:16px}
.search input{flex:1;border:0;background:transparent;font-size:15px;outline:none;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips button{flex:0 0 auto;height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--glass-b);background:var(--glass);font-size:13px;font-weight:700;color:var(--ink)}
.chips button.on{background:var(--pri-grad);color:#fff;border-color:transparent;box-shadow:var(--pri-glow)}
.ring{width:96px;height:96px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.ring>div{width:74px;height:74px;border-radius:50%;background:var(--lorb);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}
/* ================= v4: PREMIUM DIZAYN ================= */
:root{
  --bg:radial-gradient(70% 28% at 100% 0%,rgba(79,128,255,.16) 0%,rgba(79,128,255,0) 70%),linear-gradient(180deg,#F4F7FE 0%,#EBF0FC 55%,#E2E9FB 100%);
  --ink:#0B1530;--ink2:#5B6688;--ink3:#8A94B4;
  --glass:rgba(255,255,255,.84);--glass-b:rgba(255,255,255,.7);
  --glass-sh:0 1px 2px rgba(15,28,80,.04),0 10px 30px rgba(15,28,80,.07);
  --solid:#F6F8FE;--card2:#FFFFFF;
  --chip:#EDF2FF;--chipi:#2148C9;--t1:#0B1A5C;--t2:#1E3FB8;--t3:#3A6CF0;--t4:#8FAEF5;--t5:#DCE6FD;
  --pri-grad:linear-gradient(140deg,#3A6CF0 0%,#1B37A8 100%);
  --pri-glow:0 10px 24px rgba(33,72,201,.38);
  --hero:radial-gradient(120% 90% at 100% 0%,#4F80FF 0%,rgba(79,128,255,0) 55%),linear-gradient(140deg,#0A1652 0%,#1A36A8 60%,#2B58E0 100%);
  --track:#E3E9F8;--line:rgba(15,28,80,.07);--nav:rgba(255,255,255,.9);--tab-on:#EDF2FF;--addbg:#F1F5FE;
}
:root[data-theme=dark]{
  --bg:radial-gradient(70% 28% at 100% 0%,rgba(58,108,240,.22) 0%,rgba(58,108,240,0) 70%),linear-gradient(180deg,#070C22 0%,#0B1230 60%,#0E1638 100%);
  --ink:#EEF2FF;--ink2:#A6B0D4;--ink3:#6F7AA6;
  --glass:rgba(255,255,255,.055);--glass-b:rgba(255,255,255,.07);
  --glass-sh:0 10px 30px rgba(0,0,0,.35);
  --solid:#0F1736;--card2:#18224A;
  --chip:rgba(90,130,255,.15);--chipi:#A9C1FF;--t1:#2A3D99;--t5:#1B2759;
  --track:rgba(255,255,255,.09);--line:rgba(255,255,255,.07);--nav:rgba(13,19,46,.9);--tab-on:rgba(90,130,255,.15);--addbg:#0A1029;
}
html{background:#E9EFFC}
.hdr{padding:calc(14px + env(safe-area-inset-top)) 18px 12px}
.hdr h1{font-size:30px;letter-spacing:-.8px}
.wrap{padding:0 18px}
.glass{border-radius:22px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
/* ikonkalar: dumaloq "orb" o'rniga yumshoq kvadrat */
.orb{background:var(--chip);box-shadow:none;color:var(--chipi);border-radius:14px}
.orb.o40{border-radius:13px}.orb.o54{border-radius:18px}
.orb.dark{background:var(--t1);box-shadow:none;color:#fff}
.orb.tone2{background:var(--t2);color:#fff}
.orb.pri{background:var(--pri-grad);box-shadow:var(--pri-glow);color:#fff}
.hdr .orb:not(.dark):not(.pri),.orb.w{background:var(--glass);box-shadow:var(--glass-sh);color:var(--ink);border:1px solid var(--glass-b)}
.logo{display:inline-block;flex:0 0 auto;filter:drop-shadow(0 6px 14px rgba(20,45,150,.28))}.logo svg{display:block}
.avatar{width:44px;height:44px;border-radius:15px;background:var(--t1);color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;border:0}
.hero{position:relative;overflow:hidden;background:var(--hero);box-shadow:0 18px 40px rgba(20,45,150,.32)}
.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px);pointer-events:none}
.hero>*{position:relative}
.hero .big{font-size:38px;letter-spacing:-.6px}
.hero .pill{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.16)}
.hero .tag{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:13px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);font-size:12px;font-weight:700;color:#fff}
.cur{font-size:.78em;font-weight:600;opacity:.62;letter-spacing:0}
.big .cur{font-size:.56em}
.seg{background:var(--chip);border-radius:15px;padding:3px;gap:2px;border:0;box-shadow:none;backdrop-filter:none}
.seg button{height:36px;border-radius:12px;color:var(--ink2)}
.seg button.on{background:var(--card2);color:var(--ink);box-shadow:0 2px 8px rgba(15,28,80,.1)}
:root[data-theme=dark] .seg button.on{background:#24307A;color:#fff}
#add .seg button.on{background:var(--pri-grad);color:#fff;box-shadow:var(--pri-glow)}
.sec-title{margin:22px 4px 10px;font-size:17px;letter-spacing:-.3px}
.label-up{letter-spacing:.6px}
.li{padding:11px 0}
.li .t{font-weight:600}
.list{padding:2px 14px}
.bar{height:6px;background:var(--track)}
.bar i{background:linear-gradient(90deg,var(--t2),var(--t3))}
.quick button .orb{width:56px;height:56px;border-radius:19px}
.quick button:nth-child(n+3) .orb{background:var(--glass);box-shadow:var(--glass-sh);color:var(--chipi);border:1px solid var(--glass-b)}
.quick button:nth-child(2) .orb{background:var(--t2);color:#fff}
.quick button:nth-child(1) .orb{background:var(--t1);color:#fff}
/* pastki menyu: ekranga yopishgan shisha panel */
nav.tabs{left:0;right:0;transform:none;bottom:0;width:100%;max-width:none;height:calc(76px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);border-radius:22px 22px 0 0;border:0;border-top:1px solid var(--line);box-shadow:0 -8px 30px rgba(15,28,80,.06);align-items:start;padding-top:8px}
nav.tabs button{height:52px;border-radius:14px;color:var(--ink3);position:relative}
nav.tabs button.on{background:transparent;color:var(--pri-ink)}
nav.tabs button.on::before{content:"";position:absolute;top:-8px;left:50%;width:22px;height:3px;margin-left:-11px;border-radius:2px;background:currentColor}
nav.tabs button.fab{width:58px;height:58px;border-radius:20px;margin-top:-20px;background:var(--pri-grad);box-shadow:var(--pri-glow)}
#app{padding-bottom:120px}
/* kunlar bo'yicha guruh */
.dayh{display:flex;justify-content:space-between;align-items:baseline;margin:14px 4px 8px}
.dayh b{font-size:13px;font-weight:700;color:var(--ink2)}
.dayh span{font-size:12px;font-weight:700;color:var(--ink2)}
/* aylanuvchi kartalar */
.carousel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:16px -18px 0;padding:0 18px 4px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.carousel>*{flex:0 0 calc(100% - 26px);scroll-snap-align:center;margin:0!important}
.carousel>:only-child{flex-basis:100%}
.dots{display:flex;justify-content:center;gap:5px;margin-top:8px}.dots i{width:6px;height:6px;border-radius:3px;background:var(--track);transition:all .2s}.dots i.on{width:16px;background:var(--pri)}
/* xabarlar tepada */
.toast{top:calc(env(safe-area-inset-top,0px) + 12px);bottom:auto;border-radius:14px;animation:tin .22s cubic-bezier(.2,.8,.2,1)}
@keyframes tin{from{transform:translate(-50%,-14px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.qpill{top:calc(env(safe-area-inset-top,0px) + 62px)}
/* yuklanish skeleti */
.sk{background:linear-gradient(90deg,var(--track) 0%,rgba(255,255,255,.6) 50%,var(--track) 100%);background-size:200% 100%;animation:skm 1.2s linear infinite;border-radius:18px}
:root[data-theme=dark] .sk{background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.1),rgba(255,255,255,.05));background-size:200% 100%}
@keyframes skm{from{background-position:200% 0}to{background-position:-200% 0}}
/* ekranlar silliq almashadi */
#app>.wrap,#app>.tabline{animation:vin .22s ease-out}
@keyframes vin{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* summa kiritish */
#add{background:var(--bg);background-color:var(--addbg)}
.amount .val{font-size:52px}
.keys{gap:9px}
.keys button{height:56px;border-radius:17px;background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--glass-sh)}
.keys button.op{background:var(--chip);color:var(--chipi);box-shadow:none;border:0}
.keys button.ok{background:var(--pri-grad);box-shadow:var(--pri-glow)}
.cats button.on .orb{background:var(--t2);box-shadow:0 8px 18px rgba(33,72,201,.35);color:#fff}
.cats button .orb{background:var(--glass);box-shadow:var(--glass-sh);color:var(--chipi);border:1px solid var(--glass-b)}
.cats button.on span.n{color:var(--pri-ink)}
.catlbl{font-size:12px;font-weight:700;color:var(--ink2);padding:10px 20px 0}
.chip.orb.dark{background:var(--t1)}
.donut{box-shadow:none}
.donut>div{background:var(--card2);box-shadow:0 2px 10px rgba(15,28,80,.08)}
.ring>div{background:var(--card2)}
.sheet-title{font-size:20px}
.panel{background:var(--solid);border-radius:26px 26px 0 0}
.inp{background:var(--card2)}
.chips button{background:var(--glass);border:1px solid var(--glass-b)}
.chips button.on{background:var(--t2);box-shadow:none}
.toggle.on{background:var(--t2)}
.tabline button.on{border-bottom-color:var(--t2)}
.pctpill{display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:700}
.pctpill.g{background:rgba(14,122,85,.1);color:var(--green)}.pctpill.r{background:rgba(196,43,60,.1);color:var(--red)}
</style>
</head>

/* ================= 3-BOSQICH: O'ZGARISH (5.3) ================= */
// Qarz olingan pul daromad emas, qarzga to'langan pul yashash xarajati emas
function isDebtCat(id) { var c = D.categories.find(function (x) { return x.id === id; }); return !!c && /qarz/i.test(c.nomi); }
function debtById(id) { return (D.debts || []).find(function (d) { return d.id === id; }); }
function monLabel(m) { var p = String(m).split('-'); return MONTHS[+p[1] - 1] + ' ' + p[0]; }
// Oxirgi 3 to'liq oydagi o'rtacha shaxsiy daromad (100 mingga yaxlitlangan)
function avgIncome() {
  var m = ym(new Date()), s = 0, n = 0;
  for (var k = 1; k <= 3; k++) { var v = 0; pIn(addMonth(m, -k)).forEach(function (t) { if (t.turi === 'kirim' && !isDebtCat(t.kategoriya)) v += txVal(t); }); if (v > 0) { s += v; n++; } }
  return n ? Math.round(s / n / 100000) * 100000 : 0;
}
function planOn() { return Number(setv('reja_qarz')) > 0; }
function planIncome() { return Number(setv('reja_daromad')) || avgIncome(); }
function planDebt() { return Number(setv('reja_qarz')) || 0; }
function planSuggest() { return Math.max(500000, Math.round(planIncome() * 0.12 / 500000) * 500000); }
function debtPaidMonth(m) { var r = 0; (D.payments || []).forEach(function (p) { var d = debtById(p.qarz); if (d && d.turi === 'oldim' && String(p.sana).slice(0, 7) === m) r += conv(Number(p.summa) || 0, d.valyuta || 'UZS'); }); return r; }
// Shu oy: yashash uchun pul va bugungi limit. Kunlik limit kun boshida qotadi: bugungi xarajat uni o'zgartirmaydi
function monthPlan(inc, dp) {
  var m = ym(new Date()), td = today();
  inc = inc == null ? planIncome() : inc; dp = dp == null ? planDebt() : dp;
  var live = Math.max(0, inc - dp), spent = 0, spentToday = 0;
  pIn(m).forEach(function (t) { if (t.turi !== 'chiqim' || isDebtCat(t.kategoriya)) return; var v = txVal(t); spent += v; if (t.sana === td) spentToday += v; });
  var dim = daysIn(m), daysLeft = dim - new Date().getDate() + 1, perDay = Math.max(0, (live - (spent - spentToday)) / daysLeft);
  return { inc: inc, dp: dp, live: live, spent: spent, left: live - spent, today: spentToday, perDay: perDay, todayLeft: perDay - spentToday, daysLeft: daysLeft, paidDebt: debtPaidMonth(m) };
}
// Qarzdan chiqish: oyiga "monthly" so'm, tartib bo'yicha bittadan yopiladi
function payoffPlan(monthly, order) {
  var m = ym(new Date());
  order = order || setv('reja_tartib') || 'kichik';
  var list = (D.debts || []).filter(function (d) { return debtOpen(d) && d.turi === 'oldim' && debtLeft(d) > 0; })
    .map(function (d) { var l = conv(debtLeft(d), d.valyuta || 'UZS'); return { d: d, left: l, rem: l, end: null }; });
  list.sort(function (a, b) {
    if (order === 'muddat') { var x = String(a.d.muddat || '9999'), y = String(b.d.muddat || '9999'); if (x !== y) return x < y ? -1 : 1; }
    return a.left - b.left;
  });
  var r = { list: list, total: list.reduce(function (a, x) { return a + x.left; }, 0), end: null, months: 0 };
  if (!(monthly > 0) || !list.length) return r;
  var k = 0, first = Math.max(0, monthly - debtPaidMonth(m));
  while (k < 600) {
    var b = k === 0 ? first : monthly;
    for (var i = 0; i < list.length && b > 0; i++) { var x = list[i]; if (x.rem <= 0) continue; var p = Math.min(b, x.rem); x.rem -= p; b -= p; if (x.rem <= 0.5) { x.rem = 0; x.end = addMonth(m, k); } }
    if (list.every(function (x) { return x.rem <= 0; })) break;
    k++;
  }
  r.end = addMonth(m, k); r.months = k;
  return r;
}
function planStart() { try { return JSON.parse(setv('reja_boshi') || 'null'); } catch (e) { return null; } }
function monthsWord(k) { return k <= 0 ? 'shu oy' : k + ' oy qoldi'; }

  var dt = debtTotals();

    var sug = planSuggest(), pv = payoffPlan(sug);

    return h + '<button class="btn btn-pri" data-a="planForm">' + ic('flag', 18) + 'Rejani tuzish</button></div>';
  }
  var mp = monthPlan(), pl = payoffPlan(mp.dp), st = planStart();
  CTX = 'reja';
  h += '<div class="hero" style="padding:20px"><div class="between"><span class="lbl row" style="gap:8px">Qarzsiz kun ' + eyeBtn('reja', true) + '</span>' + (pl.end ? '<span class="tag">' + ic('flag', 13, 2.4) + ' ' + monthsWord(pl.months) + '</span>' : '') + '</div>' +

function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  var first = text.split('\n')[0], d = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : (first.indexOf('\t') >= 0 ? '\t' : ',');
  var rows = [], row = [], f = '', q = false;
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === d) { row.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += ch;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(function (r) { return r.some(function (x) { return x.trim(); }); });
}
function normDate(s) {
  s = String(s).trim(); var m;
  if ((m = s.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/))) return m[1] + '-' + pad(+m[2]) + '-' + pad(+m[3]);
  if ((m = s.match(/^(\d{1,2})[-./](\d{1,2})[-./](\d{4})/))) return m[3] + '-' + pad(+m[2]) + '-' + pad(+m[1]);
  return '';
}
function mapImport(rows) {
  if (rows.length < 2) throw new Error('Faylda ma\'lumot topilmadi');
  var hd = rows[0].map(function (x) { return x.toLowerCase().trim(); });
  function col(re) { for (var i = 0; i < hd.length; i++) if (re.test(hd[i])) return i; return -1; }
  var cS = col(/sana|date|дата|kun/), cA = col(/summa|amount|сумма|miqdor|sum/), cT = col(/^tur|type|тип|kirim|chiqim/),
      cC = col(/kateg|category|категор/), cH = col(/hisob|account|счет|счёт|wallet|кошел/), cI = col(/izoh|note|comment|коммент|описан|description|memo/);
  if (cS < 0 || cA < 0) throw new Error('"sana" va "summa" ustunlari topilmadi');
  return rows.slice(1).map(function (r) {
    var raw = String(r[cA] || '').replace(/\s| /g, '').replace(',', '.'), n = Number(raw.replace(/[^\d.\-]/g, ''));
    var tt = cT >= 0 ? String(r[cT]).toLowerCase() : '';
    var turi = /kirim|daromad|income|доход|приход/.test(tt) ? 'kirim' : /chiqim|xarajat|expense|расход/.test(tt) ? 'chiqim' : (n < 0 ? 'chiqim' : cT >= 0 ? 'chiqim' : 'kirim');
    if (cT < 0) turi = n < 0 ? 'chiqim' : 'kirim';
    return { sana: normDate(r[cS]), summa: Math.abs(n), turi: turi, kategoriya: cC >= 0 ? r[cC] : '', hisob: cH >= 0 ? r[cH] : '', izoh: cI >= 0 ? r[cI] : '' };
  }).filter(function (r) { return r.sana && r.summa > 0; });
}
